# GNSS-SDR Configuration File for Dual-HackRF (Galileo E1B/C OSNMA + Galileo E6B/C HAS)
# Compatible with macOS and GNU/Linux installations of gnss-sdr (https://gnss-sdr.org)
#
# Hardware setup:
#   - HackRF #0 (Master): CLKOUT -> connected via SMA coax to HackRF #1 CLKIN
#   - HackRF #0 tuned to 1575.42 MHz (Galileo E1B/C + GPS L1 C/A)
#   - HackRF #1 tuned to 1278.75 MHz (Galileo E6B/C High Accuracy Service HAS)

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=4092000
SignalSource.implementation=Osmosdr_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=4092000
SignalSource.freq=1575420000
SignalSource.gain=32
SignalSource.rf_gain=14
SignalSource.if_gain=30
SignalSource.osmosdr_args=hackrf=0,bias=1

# Channels allocation: 8 Galileo E1B/C + 6 GPS L1 C/A
Channels_1C.count=6
Channels_1B.count=8
Channels.in_acquisition=2

# Galileo E1B/C CBOC Acquisition & Tracking
Acquisition_1B.implementation=Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.doppler_max=5000
Acquisition_1B.doppler_step=250
Tracking_1B.implementation=Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.pll_bw_hz=15.0
Tracking_1B.dll_bw_hz=1.5

# Telemetry Decoder (I/NAV + OSNMA) & PVT Output
TelemetryDecoder_1B.implementation=Galileo_E1B_Telemetry_Decoder
PVT.implementation=RTKLIB_PVT
PVT.nmea_dump_filename=./trisat_sdr_nmea.nmea
PVT.flag_nmea_tty_port=false
